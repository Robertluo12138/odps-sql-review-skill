# examples/sample_table_profile.yml
# 示例 table profile，可与 examples/ 下的 bad_*.sql 配合使用：
#
#   odps-sql-review examples/bad_left_join.sql \
#       --table-profile examples/sample_table_profile.yml
#
# 实际使用时请按业务表的真实情况填写。

tables:
  dwd_xxx_order_di:
    partition_cols: ["dt"]
    grain: ["dt", "order_id"]
    unique_keys:
      - ["dt", "order_id"]
    size_level: "large"
    table_type: "fact"
    description: "订单明细表，按天分区，order_id 唯一"

  dwd_xxx_payment_di:
    partition_cols: ["dt"]
    grain: ["dt", "pay_id"]
    unique_keys:
      - ["dt", "pay_id"]
    size_level: "large"
    table_type: "fact"
    description: "支付明细表，每笔订单可能产生多条支付记录"

  dwd_xxx_user_action_di:
    partition_cols: ["dt"]
    grain: ["dt", "user_id", "action_id"]
    unique_keys:
      - ["dt", "user_id", "action_id"]
    size_level: "large"
    table_type: "fact"
    description: "用户行为明细表，最大表之一，禁止长周期 COUNT DISTINCT"

  dim_xxx_shop_df:
    partition_cols: ["dt"]
    grain: ["shop_id"]
    unique_keys:
      - ["dt", "shop_id"]
    size_level: "small"
    table_type: "dimension"
    description: "店铺维度表，可考虑 MAPJOIN"
